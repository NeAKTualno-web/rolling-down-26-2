name: build
on:
  push:
    branches: [port]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: |
          mkdir -p /tmp/out
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace > /tmp/out/build.log 2>&1
          echo $? > /tmp/out/exit-code.txt
          cp build/libs/*.jar /tmp/out/ 2>/dev/null
          rm -f /tmp/out/*-sources.jar
          ls -la /tmp/out
      - name: publish output
        if: always()
        run: |
          cd /tmp/out
          git init -q
          git checkout -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "build output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output
